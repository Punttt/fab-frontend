<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAB - Adminsida</title>
  </head>
  <body>
    <header>
      <h1>Adminsida</h1>
      <nav>
        <a href="#current">Aktuell meny</a>
        <a href="#edit">Redigera meny</a>
        <a href="#history">Tidigare veckor</a>
      </nav>
    </header>
    <main>
      <section id="select-week">
        <h2>Välj vecka</h2>

        <form id="weekForm">
          <label>
            Vecka:
            <input type="number" name="week_number" min="1" max="52" required>
          </label>

          <label>
            År:
            <input type="number" name="year" min="2020" max="2035" required>
          </label>

          <button type="submit">Ladda vecka</button>
        </form>

        <p id="weekStatus"></p>
    </section>

    </main>
    <script type="module" src="/src/js/admin.js"></script>
  </body>
</html>
