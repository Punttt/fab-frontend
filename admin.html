<!doctype html> 
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAB - Adminsida</title>
    <link rel="stylesheet" href="/src/styles/admin/admin.scss">
  </head>
  <body>
    <header>
      <h1>Adminsida</h1>

    </header>
    <main>
      <!-- Välja vecka och år för att se om det finns något registrerat i databasen -->
      <section id="select-week">
        <h2>Välj vecka</h2>
        <p>Välj den veckan du vill lägga till eller redigera.</p>
        <form id="weekForm">
          <label>
            Vecka:
            <input type="number" name="week_number" min="1" max="52" required>
          </label>

          <label>
            År:
            <input type="number" name="year" min="2020" max="2035" required value="2026">
          </label>

          <button type="submit">Ladda vecka</button>
        </form>

        <p id="weekStatus"></p>
        <div id="editExistingMenu" class="hidden">
          <button id="editMenuBtn">Redigera meny</button>
        </div>
      </section>

      <!--  -->
      <section id="edit-menu" class="hidden">
        <h2>Redigera veckomeny</h2>

        <form class="menu-day">
          <h3>Måndag</h3>
          <textarea name="dish" required></textarea>
          <input type="hidden" name="day_of_week" value="monday">
          <button type="submit">Spara</button>
        </form>

        <form class="menu-day">
          <h3>Tisdag</h3>
          <textarea name="dish" required></textarea>
          <input type="hidden" name="day_of_week" value="tuesday">
          <button type="submit">Spara</button>
        </form>

        <form class="menu-day">
          <h3>Onsdag</h3>
          <textarea name="dish" required></textarea>
          <input type="hidden" name="day_of_week" value="wednesday">
          <button type="submit">Spara</button>
        </form>

        <form class="menu-day">
          <h3>Torsdag</h3>
          <textarea name="dish" required></textarea>
          <input type="hidden" name="day_of_week" value="thursday">
          <button type="submit">Spara</button>
        </form>

        <form class="menu-day">
          <h3>Fredag</h3>
          <textarea name="dish" required></textarea>
          <input type="hidden" name="day_of_week" value="friday">
          <button type="submit">Spara</button>
        </form>
      </section>
      <button id="logoutBtn" class="btn">Logga ut</button>
    </main>
    <script type="module" src="/src/js/admin.js"></script>
  </body>
</html>
